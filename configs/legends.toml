# 007 Legends (title 415608D8). Include it from the entry point of
# legends_manifest.toml: includes = ["../../configs/legends.toml"].

# Mods (RG-007-010; called cheats until RG-007-011), from the XYZEngine
# trainer for this title in the Aurora trainer pack
# (StonedModder/Aurora-JTAG-RGH-Trainer-Pack-Repository,
# Aurora/user/Trainers/415608D8, "(XYZGEN)Trainer.xex", trainer by
# BoogieMan). Read from the trainer's code, not copied: each cheat is the
# instruction it swaps, and every original word was checked against this
# game's default.xex. Switchable, so the guide's Settings > Mods turns
# them on and off while playing. All start off.

# "God Mod": health is reloaded from its maximum instead of having the
# damage subtracted (fsubs f12,f13,f30 -> lfs f12,0x114(r26)).
[[patch]]
name = "God Mode"
category = "mod"
enabled = false
switchable = true
[[patch.be32]]
address = 0x82274F50
value = 0xC19A0114

# "Inf Ammo & No Reload": the store of the new ammo count is dropped
# (sthx r30,r10,r31 -> nop).
[[patch]]
name = "Infinite Ammo & No Reload"
category = "mod"
enabled = false
switchable = true
[[patch.be32]]
address = 0x82134444
value = 0x60000000

# "Inf Clip": the clip is set to 999 instead of reduced
# (subf r9,r10,r11 -> li r9,999).
[[patch]]
name = "Infinite Clip"
category = "mod"
enabled = false
switchable = true
[[patch.be32]]
address = 0x821360B8
value = 0x392003E7

# "Inf & Max XP": the XP read becomes 0x3B9A0000
# (lwz r11,0(r5) -> lis r11,0x3B9A).
[[patch]]
name = "Infinite & Max XP"
category = "mod"
enabled = false
switchable = true
[[patch.be32]]
address = 0x82462F38
value = 0x3D603B9A

# "Inf Time": the timer is reloaded instead of advanced
# (fadds f12,f13,f0 -> lfs f12,0x1E10(r11)).
[[patch]]
name = "Infinite Time"
category = "mod"
enabled = false
switchable = true
[[patch.be32]]
address = 0x82118E50
value = 0xC18B1E10

# "Max Score": the score read becomes 0x3B9A0000
# (lwz r11,0(r3) -> lis r11,0x3B9A).
[[patch]]
name = "Max Score"
category = "mod"
enabled = false
switchable = true
[[patch.be32]]
address = 0x8246E3F0
value = 0x3D603B9A

# The game's own cheat codes (RG-007-011), typed in at Extras > Cheat Codes.
# They are case sensitive. Nothing is patched: the guide's Settings > Cheats
# lists them so a player need not look them up. From GameRevolution's and
# Cheat Code Central's 007 Legends Xbox 360 pages (2026-10-01), which agree;
# the codes are not stored as text in the game's files, so they are not
# checked against it.

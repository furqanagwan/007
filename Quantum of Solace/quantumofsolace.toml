# Quantum of Solace (title 415607FF, media 06DD88A0)
# XEX SHA-256: a96f4f651cc0937e51aa2f81245b48ba08d71de1b8bef0e33bc2b2bca29caa42
# Include it from the entry point of quantumofsolace_manifest.toml:

# Canary game-patches "Unlock FPS" by Sowa_95, for this XEX (Canary module
# hash A29428CB1432DD9E, media 06DD88A0), copied unchanged (RG-007-008).
# The two nops change the engine's frame timing; the byte is the low half of
# `li r11,1` at 0x820F2280, the presentation interval (0x00 unlimited, 0x01
# 60 FPS, 0x02 30 FPS; 0x01 is the original). Canary's warning: "FPS higher
# than 30 can cause softlocks in certain missions." Off until the player
# turns it on.
#
# Switchable (RG-007-009): both versions of the patched words are compiled
# in, so the player can turn it on and off while playing, in the Xbox guide
# under Settings > Patches (SDK RG-GDK-041). The choice is saved.
[[patch]]
name = "Unlock FPS"
enabled = false
switchable = true
[[patch.be32]]
address = 0x8229B808
value = 0x60000000
[[patch.be32]]
address = 0x8229B86C
value = 0x60000000
[[patch.be8]]
address = 0x820F2283
value = 0x01

# Mods (RG-007-010; called cheats until RG-007-011), from the XYZEngine
# trainer for this title in the Aurora trainer pack
# (StonedModder/Aurora-JTAG-RGH-Trainer-Pack-Repository,
# Aurora/user/Trainers/415607FF, "(XYZGEN)Trainer.xex", trainer by
# Boogieman). Read from the trainer's code, not copied: each cheat is the
# instruction it swaps, and every original word was checked against this
# XEX. Switchable, so the guide's Settings > Mods turns them on and off
# while playing. All start off.

# "Inf & Max Ammo": the shot no longer subtracts from the clip; it is set
# to 999 (subf r9,r11,r10 -> ori r9,r10,999).
[[patch]]
name = "Infinite Ammo"
category = "mod"
enabled = false
switchable = true
[[patch.be32]]
address = 0x82161A38
value = 0x614903E7

# "Inf & Max grenades": likewise for grenades (subf r11,r9,r11 ->
# ori r11,r11,999).
[[patch]]
name = "Infinite Grenades"
category = "mod"
enabled = false
switchable = true
[[patch.be32]]
address = 0x821665B0
value = 0x616B03E7

# "God": the trainer detours the damage routine's health store at
# 0x82233698 (stw r11,380(r31)) and, when the last call was the one at
# 0x82233670 (lr 0x82233674, the protected-entity path), stores 30000. It
# also drops the rescaled health store at 0x82252BCC (stw r30,380(r31)).
[[patch]]
name = "God Mode"
category = "mod"
enabled = false
switchable = true
[[patch.be32]]
address = 0x82252BCC
value = 0x60000000
[[patch.set]]
address = 0x82233698
register = "r11"
value = 30000
lr = 0x82233674

# "I-Kill": the same store sets health 0 when the last call was the one at
# 0x82233480 (lr 0x82233484), the other entities' path: one hit kills.
[[patch]]
name = "One-Hit Kills"
category = "mod"
enabled = false
switchable = true
[[patch.set]]
address = 0x82233698
register = "r11"
value = 0
lr = 0x82233484

